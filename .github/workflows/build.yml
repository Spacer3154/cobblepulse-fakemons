name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Contenu (validateur du pack + tests Showdown)
        run: |
          mkdir -p out
          set +e
          python3 tools/gen/validate_pack.py src/main/resources tools/showdown > out/validate.txt 2>&1
          echo "validate=$?" >> out/CHECKS
          (cd tools/showdown && npm ci --silent && node test_customs.js ../../src/main/resources \
             && node test_deviljho.js ../../src/main/resources \
             && node test_glavenus.js ../../src/main/resources \
             && node test_magala_zamtrios.js ../../src/main/resources) > out/showdown-tests.txt 2>&1
          echo "showdown=$?" >> out/CHECKS
          exit 0

      - name: Build
        id: build
        run: |
          set +e
          ./gradlew build --stacktrace --no-daemon > out/build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "build=$status" >> out/CHECKS
          grep -E "error:|FAILURE|What went wrong" -A3 out/build.log > out/build-errors.txt || true
          cp build/libs/*.jar out/ 2>/dev/null || true
          rm -f out/*-sources.jar
          exit 0

      - name: Serveur de test (Fabric 1.21.1 + Cobblemon + Mega Showdown)
        if: steps.build.outputs.status == '0'
        timeout-minutes: 30
        run: python3 ci/server_test.py out || true

      - name: References (diagnostic)
        if: always()
        run: python3 ci/dump_refs.py out || true

      - name: Publish CI outputs to branch ci-output
        if: always()
        run: |
          cd out
          echo "sha=${GITHUB_SHA} build=${{ steps.build.outputs.status }} run=${GITHUB_RUN_ID}" > STATUS
          git init -q -b ci-output
          git config user.name "fakemons-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "CI output ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-output
